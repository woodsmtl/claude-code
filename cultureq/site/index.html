  CultureQ: front-end preview
  ==================================================================
  One self-contained HTML file: no build step, no dependencies.
  Open it in any modern browser (Chrome/Edge/Samsung Internet/Firefox/
  Safari, roughly 2020 or later) or host it on any static file server.

  WHAT IT IS
    A discovery app for events, programs, and scholarships.
      OurQueue    search, filter and browse (list, calendar, map)
      MyQueue     saved opportunities, alerts and per-date reminders
      Submit      send an official link; optional anonymous contribution
    Official pages open in a new tab; calendar files (.ics) and Google
    Calendar links are provided for every opportunity.
      Insights    anonymous engagement numbers, by link (#insights)

  WHAT IS PREVIEW-ONLY (no server exists yet)
    - Opportunities are embedded below (section 1). Each carries a
      "source" note saying where and when it was checked. Dates are
      added only when confirmed; always confirm on the official page.
    - Saved items, reminders, alerts and the account live in the
      visitor's browser storage and do not sync between devices.
    - Reminders and alerts are saved but never delivered; push, text
      and email delivery need a backend.
    - The submit form only checks the link; a server would read the
      page and fill in the details. Contributions collect nothing.
    - The map is a simplified outline without street-level detail.

  PRIVACY BY DESIGN
    - Accounts: only a salted SHA-256 hash and a masked hint
      (j•••@example.com) of the email or number are kept.
    - Reminder and alert contacts: masked hints only.
    - Location (for "Near you") is approximated, held in memory, never stored.
    - Engagement counts (section 9) hold no identity: only how often things
      happen and a coarse device label. Nothing is sent unless ANALYTICS_URL
      is set, and never when Do Not Track or Global Privacy Control is on.
    - Contributions are not linked to any account or opportunity.

  PAGE LAYOUT
    Styles   one style block, numbered sections 1-13
    Script   one script block, sections:
      1. Constants and opportunity data   6. UI components (cards, dialogs, map)
      2. Utilities and storage        7. Views (home, browse, submit)
      3. Dates and time zones         8. Reminders, alerts, accounts
      4. Icons                        9. Engagement and Insights
      5. Filtering, search, sorting   10. Events and start-up

  CONVENTIONS
    - Markup is rendered from template strings; all user or opportunity
      text goes through esc().
    - Clicks use data-act="name" mapped to ACTIONS; forms use
      data-form="name" mapped to FORMS.
-->
